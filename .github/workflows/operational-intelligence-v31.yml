name: Operational Intelligence V31 exact-source validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu-full-suite:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == 'hkmal797-bot/market-analysis-ci' && startsWith(github.event.pull_request.title, '[RUN_OPERATIONAL_INTELLIGENCE_V31]'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hkmal797-bot/market-analysis-system
          ref: d1df15ef18251f7ca6c55b57b8b266fc4b229f98
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source SHA
        working-directory: private-source
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "d1df15ef18251f7ca6c55b57b8b266fc4b229f98"
          echo "PRIVATE_SOURCE_SHA_VERIFIED=$actual"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Install existing crypto dependency
        run: python -m pip install "cryptography>=44,<48"
      - name: Compile and run complete deterministic suite
        working-directory: private-source
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m py_compile tools/local_server.py tools/operational_intelligence_v31.py tools/disaster_recovery_center_v30.py
          python -m unittest discover -s tests

  windows-contracts:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == 'hkmal797-bot/market-analysis-ci' && startsWith(github.event.pull_request.title, '[RUN_OPERATIONAL_INTELLIGENCE_V31]'))
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hkmal797-bot/market-analysis-system
          ref: d1df15ef18251f7ca6c55b57b8b266fc4b229f98
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source SHA
        working-directory: private-source
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          if ($actual -ne "d1df15ef18251f7ca6c55b57b8b266fc4b229f98") { throw "Source SHA mismatch: $actual" }
          Write-Output "PRIVATE_SOURCE_SHA_VERIFIED=$actual"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Install existing crypto dependency
        run: python -m pip install "cryptography>=44,<48"
      - name: Run Windows local integration contracts
        working-directory: private-source
        shell: pwsh
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m py_compile tools/local_server.py tools/operational_intelligence_v31.py
          python -m unittest discover -s tests -p "test_operational_intelligence_v31.py"
          python -m unittest discover -s tests -p "test_local_runtime_status_v2.py"
          python -m unittest discover -s tests -p "test_system_center_v20.py"
          python -m unittest discover -s tests -p "test_disaster_recovery_center_v30.py"
          python -m unittest discover -s tests -p "test_encrypted_recovery_drill_v29.py"
          python -m unittest discover -s tests -p "test_encrypted_recovery_drill_v29_contracts.py"
