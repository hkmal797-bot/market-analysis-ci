name: MarketAnalysis_AI V62 Research Basket Evidence Audit Dashboard exact-source validation

on:
  push:
    branches: [main, feature/research-basket-evidence-audit-dashboard-v62-ci]
    paths: [".github/workflows/research-basket-evidence-audit-dashboard-v62.yml"]
  pull_request:
    branches: [main]
    paths: [".github/workflows/research-basket-evidence-audit-dashboard-v62.yml"]

permissions:
  contents: read

concurrency:
  group: marketanalysis-v62-891cdfdb78e74e0d3996f72f7785a0c6c5c9b678
  cancel-in-progress: false

jobs:
  ubuntu-full-suite:
    name: V62 — Ubuntu full deterministic suite
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/research-basket-evidence-audit-dashboard-v62-ci')) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'hkmal797-bot/market-analysis-ci' && startsWith(github.event.pull_request.title, '[RUN_V62]'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact MarketAnalysis_AI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hkmal797-bot/market-analysis-system
          ref: 891cdfdb78e74e0d3996f72f7785a0c6c5c9b678
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify immutable source SHA
        working-directory: private-source
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "891cdfdb78e74e0d3996f72f7785a0c6c5c9b678"
          echo "PRIVATE_SOURCE_SHA_VERIFIED=$actual"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Install pinned runtime dependencies
        run: python -m pip install --disable-pip-version-check cryptography==50.0.2 tzdata==2026.6
      - name: Compile V60 audit, V62 dashboard and server
        working-directory: private-source
        run: python -m py_compile tools/research_basket_evidence_audit_v60.py tools/research_basket_stability_v59.py tools/research_basket_optimizer_v58.py tools/all_candidate_shadow_performance_v53.py tools/strategy_diversification_intelligence_v57.py tools/local_server.py
      - name: Validate V62 evidence audit dashboard HTML and JavaScript
        working-directory: private-source
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          raw = Path("apps/research-command-center/research-basket-evidence-audit.html").read_text(encoding="utf-8")
          class Checker(HTMLParser):
              def error(self, message):
                  raise RuntimeError(message)
          Checker().feed(raw)
          scripts = re.findall(r"<script[^>]*>(.*?)</script>", raw, re.S | re.I)
          if len(scripts) != 1:
              raise SystemExit("Expected one inline script in V62 evidence audit dashboard")
          Path("/tmp/research-basket-evidence-audit-v62.js").write_text("\\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/research-basket-evidence-audit-v62.js
      - name: Validate V62 overview HTML and JavaScript
        working-directory: private-source
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          raw = Path("apps/research-command-center/index.html").read_text(encoding="utf-8")
          class Checker(HTMLParser):
              def error(self, message):
                  raise RuntimeError(message)
          Checker().feed(raw)
          scripts = re.findall(r"<script[^>]*>(.*?)</script>", raw, re.S | re.I)
          if len(scripts) != 1:
              raise SystemExit("Expected one inline script in the V62 command center")
          Path("/tmp/research-evidence-command-center-v62.js").write_text("\\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/research-evidence-command-center-v62.js
      - name: Run full deterministic suite
        working-directory: private-source
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests

  windows-v62-contracts:
    name: V62 — Windows evidence, archive and launcher contracts
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/research-basket-evidence-audit-dashboard-v62-ci')) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'hkmal797-bot/market-analysis-ci' && startsWith(github.event.pull_request.title, '[RUN_V62]'))
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact MarketAnalysis_AI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hkmal797-bot/market-analysis-system
          ref: 891cdfdb78e74e0d3996f72f7785a0c6c5c9b678
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify immutable source SHA
        working-directory: private-source
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne "891cdfdb78e74e0d3996f72f7785a0c6c5c9b678") { throw "Source SHA mismatch: $actual" }
          Write-Output "PRIVATE_SOURCE_SHA_VERIFIED=$actual"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Install pinned runtime dependencies
        run: python -m pip install --disable-pip-version-check cryptography==50.0.2 tzdata==2026.6
      - name: Compile V60 implementation, V62 page and server
        working-directory: private-source
        run: python -m py_compile tools/research_basket_evidence_audit_v60.py tools/local_server.py
      - name: Run V60 and upstream evidence contracts
        working-directory: private-source
        shell: pwsh
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m unittest discover -s tests -p "test_research_basket_evidence_audit_v60.py" -v
          python -m unittest discover -s tests -p "test_research_evidence_command_center_v62.py" -v
          python -m unittest discover -s tests -p "test_research_basket_stability_v59.py" -v
          # V58 selector is exercised transitively by the V59 five-scenario contract suite (each scenario calls V58).
          python -m unittest discover -s tests -p "test_all_candidate_shadow_performance_v53.py" -v
          python -m unittest discover -s tests -p "test_strategy_diversification_intelligence_v57.py" -v
          python -m unittest discover -s tests -p "test_local_launcher_v1.py" -v

# Exact immutable MarketAnalysis_AI source: 891cdfdb78e74e0d3996f72f7785a0c6c5c9b678
