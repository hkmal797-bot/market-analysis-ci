name: Market Data Intake V1 exact-source validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/market-data-intake-v1.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/market-data-intake-v1.yml"

permissions:
  contents: read

jobs:
  ubuntu-full-suite:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'hkmal797-bot/market-analysis-ci' && startsWith(github.event.pull_request.title, '[RUN_MARKET_DATA_INTAKE_V1]'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact MarketAnalysis_AI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hkmal797-bot/market-analysis-system
          ref: 039ba06618f28c5d33c21a20bee56c2e0e18d2ad
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source commit
        working-directory: source
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "039ba06618f28c5d33c21a20bee56c2e0e18d2ad"
          echo "PRIVATE_SOURCE_SHA_VERIFIED=$actual"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Compile local intake integration
        working-directory: source
        run: python -m py_compile tools/market_data_intake.py tools/local_server.py tools/launch_local.py
      - name: Run complete unit test suite
        working-directory: source
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests

  windows-local-contracts:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'hkmal797-bot/market-analysis-ci' && startsWith(github.event.pull_request.title, '[RUN_MARKET_DATA_INTAKE_V1]'))
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact MarketAnalysis_AI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hkmal797-bot/market-analysis-system
          ref: 039ba06618f28c5d33c21a20bee56c2e0e18d2ad
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source commit
        working-directory: source
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          if ($actual -ne "039ba06618f28c5d33c21a20bee56c2e0e18d2ad") { throw "Source SHA mismatch: $actual" }
          Write-Output "PRIVATE_SOURCE_SHA_VERIFIED=$actual"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Compile Windows local integration
        working-directory: source
        run: python -m py_compile tools/market_data_intake.py tools/local_server.py tools/launch_local.py
      - name: Run Windows local contracts
        working-directory: source
        shell: pwsh
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m unittest discover -s tests -p "test_market_data_intake_v1.py"
          python -m unittest discover -s tests -p "test_market_data_intake_http_v1.py"
          python -m unittest discover -s tests -p "test_research_session_controller_v1.py"
          python -m unittest discover -s tests -p "test_research_session_http_v1.py"
          python -m unittest discover -s tests -p "test_local_runtime_status_v2.py"
          python -m unittest discover -s tests -p "test_research_run_archive_v1.py"
          python -m unittest discover -s tests -p "test_offline_research_cycle_v1.py"
          python -m unittest discover -s tests -p "test_portfolio_research_campaign_v1.py"
          python -m unittest discover -s tests -p "test_local_launcher_v1.py"
