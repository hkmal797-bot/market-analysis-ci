name: MarketAnalysis_AI Phase 07 Order Lifecycle Simulator acceptance
on:
  push:
    branches: [main]
    paths: [".github/workflows/phase07-lifecycle-acceptance.yml"]
  pull_request:
    branches: [main]
    paths: [".github/workflows/phase07-lifecycle-acceptance.yml"]
permissions:
  contents: read
concurrency:
  group: marketanalysis-phase07-c1d3ec5307b45ed4401ae10760c256d3bc612d77
  cancel-in-progress: false
jobs:
  ubuntu-full-suite:
    name: Phase 07 exact source — Ubuntu full deterministic suite
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'hkmal797-bot/market-analysis-ci' && startsWith(github.event.pull_request.title, '[RUN_PHASE07]'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact MarketAnalysis_AI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hkmal797-bot/market-analysis-system
          ref: c1d3ec5307b45ed4401ae10760c256d3bc612d77
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify immutable source SHA
        working-directory: private-source
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "c1d3ec5307b45ed4401ae10760c256d3bc612d77"
          echo "PRIVATE_SOURCE_SHA_VERIFIED=$actual"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Install pinned runtime dependencies
        run: python -m pip install --disable-pip-version-check cryptography==50.0.2 tzdata==2026.6
      - name: Compile Phase 07 lifecycle implementation and contracts
        working-directory: private-source
        run: python -m py_compile src/ma_engine/execution_lifecycle.py tests/test_execution_lifecycle_v1.py tests/test_control_center_v1.py
      - name: Verify reconciled Phase 07 SHA-256 manifest
        working-directory: private-source
        run: sha256sum -c docs/DATA_LAST_PHASE07_EXECUTION_LIFECYCLE_SHA256SUMS.txt
      - name: Run full deterministic suite
        working-directory: private-source
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests
  windows-lifecycle-contracts:
    name: Phase 07 exact source — Windows lifecycle and Control Center contracts
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'hkmal797-bot/market-analysis-ci' && startsWith(github.event.pull_request.title, '[RUN_PHASE07]'))
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact MarketAnalysis_AI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hkmal797-bot/market-analysis-system
          ref: c1d3ec5307b45ed4401ae10760c256d3bc612d77
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify immutable source SHA
        working-directory: private-source
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne "c1d3ec5307b45ed4401ae10760c256d3bc612d77") { throw "Source SHA mismatch: $actual" }
          Write-Output "PRIVATE_SOURCE_SHA_VERIFIED=$actual"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Install pinned runtime dependencies
        run: python -m pip install --disable-pip-version-check cryptography==50.0.2 tzdata==2026.6
      - name: Compile Phase 07 lifecycle implementation and contracts
        working-directory: private-source
        run: python -m py_compile src/ma_engine/execution_lifecycle.py tests/test_execution_lifecycle_v1.py tests/test_control_center_v1.py
      - name: Emit current Phase 07 SHA-256 values for manifest reconciliation
        working-directory: private-source
        run: |
          python -c "import hashlib,pathlib,subprocess; p=pathlib.Path('docs/DATA_LAST_PHASE07_EXECUTION_LIFECYCLE_SHA256SUMS.txt'); rows=[x.split(None,1) for x in p.read_text(encoding='utf-8').splitlines() if x and not x.startswith('#')]; bad=[name for digest,name in rows if hashlib.sha256(subprocess.check_output(['git','show','HEAD:'+name])).hexdigest()!=digest]; print('MANIFEST_FAILURES='+','.join(bad)); assert not bad"
      - name: Run Phase 07 lifecycle contracts
        working-directory: private-source
        shell: pwsh
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m unittest discover -s tests -p "test_execution_lifecycle_v1.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_control_center_v1.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_stage06_import_boundary.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
