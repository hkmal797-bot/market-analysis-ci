name: Phase 12 strategy catalogue final exact-source validation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase12-strategy-catalog-final.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase12-strategy-catalog-${{ github.sha }}
  cancel-in-progress: false

jobs:
  ubuntu:
    name: Phase 12 exact source — Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout CI workflow repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout immutable private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hkmal797-bot/market-analysis-system
          ref: 907130198109c8a24656c0e59206b284b70dec1f
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source SHA
        working-directory: private-source
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          expected="907130198109c8a24656c0e59206b284b70dec1f"
          test "$actual" = "$expected"
          echo "PRIVATE_SOURCE_SHA_VERIFIED=$actual"
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Run complete retained unit suite
        working-directory: private-source
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/phase12-ubuntu-tests.log"
      - name: SHA-256 manifest
        working-directory: private-source
        shell: bash
        run: |
          sha256sum src/ma_engine/strategy_catalog.py src/ma_engine/strategy_research.py src/ma_engine/control_center.py src/ma_engine/runtime.py src/ma_engine/__init__.py tests/test_strategy_catalog_v1.py tests/test_strategy_research_v1.py tests/test_runtime_v1.py tests/test_control_center_v1.py tests/test_stage06_import_boundary.py tests/test_stages_01_03.py docs/architecture/PHASE12_STRATEGY_CATALOG_GOVERNANCE_V1.md

  windows:
    name: Phase 12 exact source — Windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout CI workflow repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout immutable private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hkmal797-bot/market-analysis-system
          ref: 907130198109c8a24656c0e59206b284b70dec1f
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source SHA
        working-directory: private-source
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          $expected = "907130198109c8a24656c0e59206b284b70dec1f"
          if ($actual -ne $expected) { throw "PRIVATE_SOURCE_SHA_MISMATCH" }
          Write-Output "PRIVATE_SOURCE_SHA_VERIFIED=$actual"
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Run cross-platform core and runtime test groups
        working-directory: private-source
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        shell: pwsh
        run: |
          $patterns = @(
            "test_stages_01_03.py",
            "test_marketanalysis_core*.py",
            "test_stages_04_05.py",
            "test_stages_06.py",
            "test_stages_07.py",
            "test_stages_08.py",
            "test_execution_lifecycle_v1.py",
            "test_decision_assistant_v1.py",
            "test_control_center_v1.py",
            "test_runtime_v1.py",
            "test_strategy_research_v1.py",
            "test_strategy_catalog_v1.py",
            "test_stage06_import_boundary.py"
          )
          foreach ($pattern in $patterns) {
            $matches = Get-ChildItem -Path tests -Filter $pattern -File
            if ($matches.Count -eq 0) { throw "EXPECTED_TEST_GROUP_MISSING=$pattern" }
            python -m unittest discover -s tests -p $pattern -v
            if ($LASTEXITCODE -ne 0) { throw "WINDOWS_TEST_GROUP_FAILED=$pattern" }
            Write-Output "WINDOWS_TEST_GROUP=PASS PATTERN=$pattern"
          }
      - name: SHA-256 manifest
        working-directory: private-source
        shell: pwsh
        run: |
          $files = @(
            "src/ma_engine/strategy_catalog.py",
            "src/ma_engine/strategy_research.py",
            "src/ma_engine/runtime.py",
            "src/ma_engine/__init__.py",
            "tests/test_strategy_catalog_v1.py",
            "tests/test_strategy_research_v1.py",
            "tests/test_runtime_v1.py",
            "tests/test_control_center_v1.py",
            "tests/test_stage06_import_boundary.py",
            "tests/test_stages_01_03.py",
            "docs/architecture/PHASE12_STRATEGY_CATALOG_GOVERNANCE_V1.md"
          )
          Get-FileHash -Algorithm SHA256 -LiteralPath $files | ForEach-Object {
            Write-Output "$($_.Hash)  $($_.Path)"
          }
