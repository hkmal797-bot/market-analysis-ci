name: Integrated adaptive portfolio cycle exact-source validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integrated-adaptive-portfolio-exact-source
  cancel-in-progress: false

jobs:
  ubuntu-full-suite:
    name: Ubuntu — exact-source full suite
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout CI controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout exact private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hkmal797-bot/market-analysis-system
          ref: 2a4cc3f8fc289a0712073b2d9614f32ff387bd69
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source SHA
        working-directory: private-source
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "2a4cc3f8fc289a0712073b2d9614f32ff387bd69"
          echo "PRIVATE_SOURCE_SHA_VERIFIED=$actual"
      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Run complete deterministic suite
        working-directory: private-source
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v
      - name: Fingerprint integrated source and tests
        working-directory: private-source
        shell: bash
        run: |
          sha256sum src/ma_engine/integrated_research_cycle.py src/ma_engine/runtime.py src/ma_engine/__init__.py tests/test_integrated_adaptive_portfolio_cycle_v1.py tests/test_stage06_import_boundary.py tests/test_stages_01_03.py docs/architecture/INTEGRATED_ADAPTIVE_PORTFOLIO_CYCLE_V1.md

  windows-safety-suite:
    name: Windows — integrated, adaptive, portfolio and import safety
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout CI controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout exact private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hkmal797-bot/market-analysis-system
          ref: 2a4cc3f8fc289a0712073b2d9614f32ff387bd69
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source SHA
        working-directory: private-source
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne "2a4cc3f8fc289a0712073b2d9614f32ff387bd69") { throw "PRIVATE_SOURCE_SHA_MISMATCH" }
          Write-Output "PRIVATE_SOURCE_SHA_VERIFIED=$actual"
      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Run targeted deterministic and safety suites
        working-directory: private-source
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_integrated_adaptive_portfolio_cycle_v1.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_portfolio_research_campaign_v1.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_adaptive_intelligence_v1.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_paper_supervisor_v1.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_portfolio_*v1.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_stage06_import_boundary.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_stages_01_03.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fingerprint integrated source
        working-directory: private-source
        shell: pwsh
        run: |
          Get-FileHash src/ma_engine/integrated_research_cycle.py -Algorithm SHA256
          Get-FileHash tests/test_integrated_adaptive_portfolio_cycle_v1.py -Algorithm SHA256
