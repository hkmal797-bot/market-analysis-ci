name: Research Run Archive V1 exact-source validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ubuntu-full-suite:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'hkmal797-bot/market-analysis-ci' && startsWith(github.event.pull_request.title, '[RUN_RESEARCH_ARCHIVE_V1]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact MarketAnalysis_AI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hkmal797-bot/market-analysis-system
          ref: eba60f1a44e37c4261b8ec5f5caae5b2f8ff6c1d
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source commit
        working-directory: source
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "eba60f1a44e37c4261b8ec5f5caae5b2f8ff6c1d"
          echo "PRIVATE_SOURCE_SHA_VERIFIED=$actual"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Compile local archive integration
        working-directory: source
        run: python -m py_compile tools/research_archive.py tools/local_persistence.py tools/local_server.py tools/launch_local.py
      - name: Run complete unit test suite
        working-directory: source
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests

  windows-local-contract:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'hkmal797-bot/market-analysis-ci' && startsWith(github.event.pull_request.title, '[RUN_RESEARCH_ARCHIVE_V1]')
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact MarketAnalysis_AI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hkmal797-bot/market-analysis-system
          ref: eba60f1a44e37c4261b8ec5f5caae5b2f8ff6c1d
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source commit
        working-directory: source
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          if ($actual -ne "eba60f1a44e37c4261b8ec5f5caae5b2f8ff6c1d") { throw "Source SHA mismatch: $actual" }
          Write-Output "PRIVATE_SOURCE_SHA_VERIFIED=$actual"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Run Windows archive, launcher, and API contracts
        working-directory: source
        shell: pwsh
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m unittest discover -s tests -p "test_research_run_archive_v1.py"
          python -m unittest discover -s tests -p "test_persistent_audit_v1.py"
          python -m unittest discover -s tests -p "test_local_runtime_status_v2.py"
          python -m unittest discover -s tests -p "test_local_launcher_v1.py"
