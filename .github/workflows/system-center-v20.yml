name: System Center V20 exact-source validation
# PR-triggered exact-source verification for the MarketAnalysis_AI V20 workspace.
run-name: System Center V20 exact-source validation

on:
  push:
    branches: [main]
    paths: [".github/workflows/system-center-v20.yml"]
  pull_request:
    branches: [main]
    paths: [".github/workflows/system-center-v20.yml"]

permissions:
  contents: read

jobs:
  ubuntu-full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact MarketAnalysis_AI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hkmal797-bot/market-analysis-system
          ref: 570182cac42093dbfa19c410b6118e82884359ab
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source commit
        working-directory: source
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "570182cac42093dbfa19c410b6118e82884359ab"
          echo "PRIVATE_SOURCE_SHA_VERIFIED=$actual"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Install existing test dependency
        run: python -m pip install "cryptography>=44,<47"
      - name: Compile local server
        working-directory: source
        run: python -m py_compile tools/local_server.py
      - name: Validate dashboard HTML and JavaScript
        working-directory: source
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          class Checker(HTMLParser):
              pass
          names = ("index.html", "strategy-library.html", "research-intelligence.html", "unified-command-center.html", "system-center.html")
          for name in names:
              source = (Path("apps/research-command-center") / name).read_text(encoding="utf-8")
              Checker().feed(source)
              scripts = re.findall(r"<script[^>]*>(.*?)</script>", source, re.S | re.I)
              Path("/tmp/" + name + ".js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/index.html.js
          node --check /tmp/strategy-library.html.js
          node --check /tmp/research-intelligence.html.js
          node --check /tmp/unified-command-center.html.js
          node --check /tmp/system-center.html.js
      - name: Run complete deterministic test suite
        working-directory: source
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v

  windows-dashboard-contracts:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact MarketAnalysis_AI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hkmal797-bot/market-analysis-system
          ref: 570182cac42093dbfa19c410b6118e82884359ab
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source commit
        working-directory: source
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne "570182cac42093dbfa19c410b6118e82884359ab") { throw "Source SHA mismatch: $actual" }
          Write-Output "PRIVATE_SOURCE_SHA_VERIFIED=$actual"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Compile local server
        working-directory: source
        run: python -m py_compile tools/local_server.py
      - name: Run dashboard contract tests
        working-directory: source
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m unittest discover -s tests -p "test_unified_workspace_v18.py" -v
          python -m unittest discover -s tests -p "test_native_dashboard_v19.py" -v
          python -m unittest discover -s tests -p "test_system_center_v20.py" -v

# Exact source pin: 570182cac42093dbfa19c410b6118e82884359ab
