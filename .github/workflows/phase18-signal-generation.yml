name: Phase 18 Signal Generation exact-source cross-platform validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hkmal797-bot/market-analysis-system
          ref: b26a1f4e0c5ff69a00a831aff4b27236e2cdd269
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify pinned source
        working-directory: private-source
        run: |
          test "$(git rev-parse HEAD)" = "b26a1f4e0c5ff69a00a831aff4b27236e2cdd269"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Full unit suite
        working-directory: private-source
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v
      - name: SHA256 manifest
        working-directory: private-source
        run: sha256sum src/ma_engine/*.py tests/test_strategy_signal_generation_v1.py tests/test_stage06_import_boundary.py

  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hkmal797-bot/market-analysis-system
          ref: b26a1f4e0c5ff69a00a831aff4b27236e2cdd269
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify pinned source
        working-directory: private-source
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne "b26a1f4e0c5ff69a00a831aff4b27236e2cdd269") { throw "SOURCE_SHA_MISMATCH" }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Windows test groups
        working-directory: private-source
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        shell: pwsh
        run: |
          $patterns = @("test_stages_01_03.py","test_marketanalysis_core*.py","test_stages_04_05.py","test_stages_06.py","test_stages_07.py","test_stages_08.py","test_execution_lifecycle_v1.py","test_decision_assistant_v1.py","test_control_center_v1.py","test_runtime_v1.py","test_strategy_research_v1.py","test_strategy_catalog_v1.py","test_strategy_family_expansion_v1.py","test_market_regime_routing_v1.py","test_regime_aware_research_v1.py","test_regime_risk_v1.py","test_offline_research_cycle_v1.py","test_strategy_signal_generation_v1.py","test_stage06_import_boundary.py")
          foreach ($pattern in $patterns) {
            $found = Get-ChildItem tests -Filter $pattern -File
            if ($found.Count -eq 0) { throw "MISSING_GROUP=$pattern" }
            python -m unittest discover -s tests -p $pattern -v
            if ($LASTEXITCODE -ne 0) { throw "FAILED_GROUP=$pattern" }
          }
      - name: SHA256 manifest
        working-directory: private-source
        shell: pwsh
        run: |
          $files = @('src/ma_engine/*.py','tests/test_strategy_signal_generation_v1.py','tests/test_stage06_import_boundary.py')
          Get-FileHash -Algorithm SHA256 -LiteralPath $files
