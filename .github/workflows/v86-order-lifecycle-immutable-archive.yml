name: MarketAnalysis_AI V86 Immutable Order Lifecycle Archive acceptance
on:
  push:
    branches: [main]
    paths: [".github/workflows/v86-order-lifecycle-immutable-archive.yml"]
  pull_request:
    branches: [main]
    paths: [".github/workflows/v86-order-lifecycle-immutable-archive.yml"]
permissions:
  contents: read
concurrency:
  group: marketanalysis-v86-b3998d369e12763fff279ad7a7974997d472d1e0
  cancel-in-progress: false
jobs:
  ubuntu-full-suite:
    name: V86 exact source — Ubuntu full deterministic suite
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'hkmal797-bot/market-analysis-ci' && startsWith(github.event.pull_request.title, '[RUN_V86]'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact MarketAnalysis_AI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hkmal797-bot/market-analysis-system
          ref: b3998d369e12763fff279ad7a7974997d472d1e0
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify immutable source SHA
        working-directory: private-source
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "b3998d369e12763fff279ad7a7974997d472d1e0"
          echo "PRIVATE_SOURCE_SHA_VERIFIED=$actual"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Install pinned runtime dependencies
        run: python -m pip install --disable-pip-version-check cryptography==50.0.2 tzdata==2026.6
      - name: Compile V86 archive server and contracts
        working-directory: private-source
        run: python -m py_compile tools/local_server.py tests/test_order_lifecycle_archive_v86.py tests/test_order_lifecycle_dashboard_v85.py
      - name: Run full deterministic suite
        working-directory: private-source
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests
  windows-archive-contracts:
    name: V86 exact source — Windows archive and dashboard contracts
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'hkmal797-bot/market-analysis-ci' && startsWith(github.event.pull_request.title, '[RUN_V86]'))
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact MarketAnalysis_AI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hkmal797-bot/market-analysis-system
          ref: b3998d369e12763fff279ad7a7974997d472d1e0
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify immutable source SHA
        working-directory: private-source
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne "b3998d369e12763fff279ad7a7974997d472d1e0") { throw "Source SHA mismatch: $actual" }
          Write-Output "PRIVATE_SOURCE_SHA_VERIFIED=$actual"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Install pinned runtime dependencies
        run: python -m pip install --disable-pip-version-check cryptography==50.0.2 tzdata==2026.6
      - name: Compile V86 archive server and contracts
        working-directory: private-source
        run: python -m py_compile tools/local_server.py tests/test_order_lifecycle_archive_v86.py tests/test_order_lifecycle_dashboard_v85.py
      - name: Run V86 and related dashboard contracts
        working-directory: private-source
        shell: pwsh
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m unittest discover -s tests -p "test_order_lifecycle_archive_v86.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_order_lifecycle_dashboard_v85.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_execution_lifecycle_v1.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_local_runtime_status_v2.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_research_command_center_ui_v1.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_stage06_import_boundary.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
