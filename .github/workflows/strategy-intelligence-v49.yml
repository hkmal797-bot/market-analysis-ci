name: MarketAnalysis_AI V49 Strategy Intelligence exact-source validation

on:
  push:
    branches: [main, feature/strategy-intelligence-v49-ci]
    paths: [".github/workflows/strategy-intelligence-v49.yml"]
  pull_request:
    branches: [main]
    paths: [".github/workflows/strategy-intelligence-v49.yml"]

permissions:
  contents: read

concurrency:
  group: marketanalysis-v49-5003b386e282cdf3340576142605ba4bd47f3e58
  cancel-in-progress: false

jobs:
  ubuntu-full-suite:
    name: V49 — Ubuntu full deterministic suite
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/strategy-intelligence-v49-ci')) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'hkmal797-bot/market-analysis-ci' && startsWith(github.event.pull_request.title, '[RUN_V49]'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact MarketAnalysis_AI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hkmal797-bot/market-analysis-system
          ref: 5003b386e282cdf3340576142605ba4bd47f3e58
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify immutable source SHA
        working-directory: private-source
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "5003b386e282cdf3340576142605ba4bd47f3e58"
          echo "PRIVATE_SOURCE_SHA_VERIFIED=$actual"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Install pinned runtime dependencies
        run: python -m pip install --disable-pip-version-check cryptography==50.0.2 tzdata==2026.6
      - name: Compile V49 implementation
        working-directory: private-source
        run: python -m py_compile tools/strategy_intelligence_v49.py tools/local_server.py
      - name: Validate dashboard HTML and JavaScript
        working-directory: private-source
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          path = Path("apps/research-command-center/strategy-intelligence.html")
          source = path.read_text(encoding="utf-8")
          class Checker(HTMLParser):
              def error(self, message):
                  raise RuntimeError(message)
          Checker().feed(source)
          scripts = re.findall(r"<script[^>]*>(.*?)</script>", source, re.S | re.I)
          if len(scripts) != 1:
              raise SystemExit("Expected exactly one inline dashboard script")
          Path("/tmp/strategy-intelligence-v49.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/strategy-intelligence-v49.js
      - name: Run full deterministic suite
        working-directory: private-source
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests

  windows-dashboard-contracts:
    name: V49 — Windows dashboard and API contracts
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/strategy-intelligence-v49-ci')) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'hkmal797-bot/market-analysis-ci' && startsWith(github.event.pull_request.title, '[RUN_V49]'))
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact MarketAnalysis_AI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hkmal797-bot/market-analysis-system
          ref: 5003b386e282cdf3340576142605ba4bd47f3e58
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify immutable source SHA
        working-directory: private-source
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne "5003b386e282cdf3340576142605ba4bd47f3e58") { throw "Source SHA mismatch: $actual" }
          Write-Output "PRIVATE_SOURCE_SHA_VERIFIED=$actual"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Install pinned runtime dependencies
        run: python -m pip install --disable-pip-version-check cryptography==50.0.2 tzdata==2026.6
      - name: Compile V49 implementation
        working-directory: private-source
        run: python -m py_compile tools/strategy_intelligence_v49.py tools/local_server.py
      - name: Run V49 dashboard and API contracts
        working-directory: private-source
        shell: pwsh
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m unittest discover -s tests -p "test_strategy_intelligence_v49.py" -v
          python -m unittest discover -s tests -p "test_strategy_intelligence_http_v49.py" -v
          python -m unittest discover -s tests -p "test_local_launcher_v1.py" -v

# Exact immutable MarketAnalysis_AI source: 5003b386e282cdf3340576142605ba4bd47f3e58
