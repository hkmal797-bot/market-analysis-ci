name: MarketAnalysis_AI V51 Strategy Portfolio exact-source validation

on:
  push:
    branches: [main, feature/strategy-portfolio-v51-ci]
    paths: [".github/workflows/strategy-portfolio-v51.yml"]
  pull_request:
    branches: [main]
    paths: [".github/workflows/strategy-portfolio-v51.yml"]

permissions:
  contents: read

concurrency:
  group: marketanalysis-v51-6209809b422e3b013f4c0b1af60207d4d0ffc03f
  cancel-in-progress: false

jobs:
  ubuntu-full-suite:
    name: V51 — Ubuntu full deterministic suite
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/strategy-portfolio-v51-ci')) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'hkmal797-bot/market-analysis-ci' && startsWith(github.event.pull_request.title, '[RUN_V51]'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact MarketAnalysis_AI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hkmal797-bot/market-analysis-system
          ref: 6209809b422e3b013f4c0b1af60207d4d0ffc03f
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify immutable source SHA
        working-directory: private-source
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "6209809b422e3b013f4c0b1af60207d4d0ffc03f"
          echo "PRIVATE_SOURCE_SHA_VERIFIED=$actual"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Install pinned runtime dependencies
        run: python -m pip install --disable-pip-version-check cryptography==50.0.2 tzdata==2026.6
      - name: Compile V51 implementation and server
        working-directory: private-source
        run: python -m py_compile tools/strategy_portfolio_research_v51.py tools/adaptive_strategy_selection_v50.py tools/local_server.py
      - name: Validate V51 dashboard HTML and JavaScript
        working-directory: private-source
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          for name in ("strategy-portfolio.html", "adaptive-selection.html"):
              source = Path("apps/research-command-center") / name
              raw = source.read_text(encoding="utf-8")
              class Checker(HTMLParser):
                  def error(self, message):
                      raise RuntimeError(message)
              Checker().feed(raw)
              scripts = re.findall(r"<script[^>]*>(.*?)</script>", raw, re.S | re.I)
              if len(scripts) != 1:
                  raise SystemExit(f"Expected one inline script in {name}")
              Path("/tmp/" + name + ".js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/strategy-portfolio.html.js
          node --check /tmp/adaptive-selection.html.js
      - name: Run full deterministic suite
        working-directory: private-source
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests

  windows-v51-contracts:
    name: V51 — Windows basket, API, and launcher contracts
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/strategy-portfolio-v51-ci')) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'hkmal797-bot/market-analysis-ci' && startsWith(github.event.pull_request.title, '[RUN_V51]'))
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact MarketAnalysis_AI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hkmal797-bot/market-analysis-system
          ref: 6209809b422e3b013f4c0b1af60207d4d0ffc03f
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify immutable source SHA
        working-directory: private-source
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne "6209809b422e3b013f4c0b1af60207d4d0ffc03f") { throw "Source SHA mismatch: $actual" }
          Write-Output "PRIVATE_SOURCE_SHA_VERIFIED=$actual"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Install pinned runtime dependencies
        run: python -m pip install --disable-pip-version-check cryptography==50.0.2 tzdata==2026.6
      - name: Compile V51 implementation
        working-directory: private-source
        run: python -m py_compile tools/strategy_portfolio_research_v51.py tools/adaptive_strategy_selection_v50.py tools/local_server.py
      - name: Run V51 portfolio and HTTP contracts
        working-directory: private-source
        shell: pwsh
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m unittest discover -s tests -p "test_strategy_portfolio_research_v51.py" -v
          python -m unittest discover -s tests -p "test_strategy_portfolio_research_http_v51.py" -v
          python -m unittest discover -s tests -p "test_local_launcher_v1.py" -v

# Exact immutable MarketAnalysis_AI source: 6209809b422e3b013f4c0b1af60207d4d0ffc03f
