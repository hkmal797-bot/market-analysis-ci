name: MarketAnalysis_AI V60 Research Basket Evidence Audit exact-source validation

on:
  push:
    branches: [main, feature/research-basket-evidence-audit-v60-ci]
    paths: [".github/workflows/research-basket-evidence-audit-v60.yml"]
  pull_request:
    branches: [main]
    paths: [".github/workflows/research-basket-evidence-audit-v60.yml"]

permissions:
  contents: read

concurrency:
  group: marketanalysis-v60-2e9d51d7442f57214ffce164c35ce59398671ba9
  cancel-in-progress: false

jobs:
  ubuntu-full-suite:
    name: V60 — Ubuntu full deterministic suite
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/research-basket-evidence-audit-v60-ci')) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'hkmal797-bot/market-analysis-ci' && startsWith(github.event.pull_request.title, '[RUN_V60]'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact MarketAnalysis_AI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hkmal797-bot/market-analysis-system
          ref: 2e9d51d7442f57214ffce164c35ce59398671ba9
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify immutable source SHA
        working-directory: private-source
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "2e9d51d7442f57214ffce164c35ce59398671ba9"
          echo "PRIVATE_SOURCE_SHA_VERIFIED=$actual"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Install pinned runtime dependencies
        run: python -m pip install --disable-pip-version-check cryptography==50.0.2 tzdata==2026.6
      - name: Compile V60 evidence audit and dependencies
        working-directory: private-source
        run: python -m py_compile tools/research_basket_evidence_audit_v60.py tools/research_basket_stability_v59.py tools/research_basket_optimizer_v58.py tools/all_candidate_shadow_performance_v53.py tools/strategy_diversification_intelligence_v57.py tools/local_server.py
      - name: Run full deterministic suite
        working-directory: private-source
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests

  windows-v60-contracts:
    name: V60 — Windows evidence, archive and launcher contracts
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/research-basket-evidence-audit-v60-ci')) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'hkmal797-bot/market-analysis-ci' && startsWith(github.event.pull_request.title, '[RUN_V60]'))
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact MarketAnalysis_AI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hkmal797-bot/market-analysis-system
          ref: 2e9d51d7442f57214ffce164c35ce59398671ba9
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify immutable source SHA
        working-directory: private-source
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne "2e9d51d7442f57214ffce164c35ce59398671ba9") { throw "Source SHA mismatch: $actual" }
          Write-Output "PRIVATE_SOURCE_SHA_VERIFIED=$actual"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Install pinned runtime dependencies
        run: python -m pip install --disable-pip-version-check cryptography==50.0.2 tzdata==2026.6
      - name: Compile V60 implementation and server
        working-directory: private-source
        run: python -m py_compile tools/research_basket_evidence_audit_v60.py tools/local_server.py
      - name: Run V60 and upstream evidence contracts
        working-directory: private-source
        shell: pwsh
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m unittest discover -s tests -p "test_research_basket_evidence_audit_v60.py" -v
          python -m unittest discover -s tests -p "test_research_basket_stability_v59.py" -v
          python -m unittest discover -s tests -p "test_research_basket_optimizer_v58.py" -v
          python -m unittest discover -s tests -p "test_all_candidate_shadow_performance_v53.py" -v
          python -m unittest discover -s tests -p "test_strategy_diversification_intelligence_v57.py" -v
          python -m unittest discover -s tests -p "test_local_launcher_v1.py" -v

# Exact immutable MarketAnalysis_AI source: 2e9d51d7442f57214ffce164c35ce59398671ba9
