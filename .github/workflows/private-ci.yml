name: Private repository CI runner
# Trusted main updates validate the allow-listed private feature branch on the public runner.
# Archive replay and live ingestion share one canonical content-identity digest.
# Final candidate selection is validated against a separate untouched holdout.
# Daily cycle tests enforce the configured seven-calendar-day latest-bar freshness bound.
# Adaptive cycle tests bind selected decisions to append-only, linked prequential outcomes.
# Shadow events use stable per-session fingerprints across extended historical replay.
# Prequential records bind canonical event payloads, not shifting sequence hashes.
# Frozen out-of-time tests require a future-only append and a durable single-use reservation.
# Registry integrity, retention gates and exclusion preflight are tested on both operating systems.
# Frozen-registry tests explicitly close SQLite handles before Windows temp cleanup.
# Frozen exclusions reject boundary labels and a missing registry cannot silently reset.
# Provider-backed adaptive cycles require the durable registry and auto-load its exclusions.
# Cross-provider parity binds raw response hashes, adjustment bases and exact listing/session intersections.
# Split-event fixture IDs use the canonical archive observation identifier format.
# Canonical seven-root order and provider feed errors are asserted independently.
# Split-event candidates outside the exact seven listing IDs are rejected.
# The verifier binds aggregate statuses and records non-equivalent IEX versus consolidated feed scope.
# Historical SIP remains blocked by the tested account-specific 403; no SIP retry is performed.
# Insufficient holdout tests retain observed sample counts for auditability.
# EODHD split endpoint ratios are parsed as unclassified observations until action type and listing mapping are independently resolved.
# Split-adjustment consumers retain canonical record bytes and verify their SHA-256 before reconstruction.
# The parity verifier replays the canonical split-evidence payload and checks its content digest.
# Portfolio risk governance independently blocks concentration, turnover, drawdown and liquidity breaches.
# Risk governor fixtures now model sector aggregation and incremental ADV consumption correctly.
# Positive daily returns are non-loss observations; risk thresholds may explicitly be zero.
# Malformed risk assessment receipts are rejected without verifier exceptions.
# The canonical receipt verifier guard remains inside its fail-closed exception boundary.
# Adaptive orchestration joins verified strategy selection to complete portfolio risk approval.
# Capital allocation binds quality and dated ADV evidence to capped, residual-cash target weights.
# Adaptive capital-risk pipeline binds selection, allocation, risk, and final research decision receipts.
# Revalidation after duplicate-ID fixture correction and adaptive-memory status binding.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      private_ref:
        description: Private repository branch to test
        required: true
        type: choice
        options:
          - feature/adaptive-daily-supervisor-cycle-v1
          - feature/adaptive-frozen-registry-enforcement-v1
          - feature/cross-provider-ohlcv-parity-v1
          - feature/portfolio-risk-governor-v1
          - feature/adaptive-portfolio-risk-orchestration-v1
          - feature/evidence-weighted-capital-allocation-v1
          - feature/adaptive-capital-risk-pipeline-v1

permissions:
  contents: read

concurrency:
  group: private-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit-tests:
    name: Standard-library unit tests (Ubuntu)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout private source (read-only token; credentials not persisted)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hkmal797-bot/market-analysis-system
          ref: ${{ inputs.private_ref || 'feature/adaptive-capital-risk-pipeline-v1' }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Run complete deterministic unit-test suite
        working-directory: private-source
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v

  windows-paper-safety:
    name: Windows Paper safety and adaptive-cycle tests
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout private source (read-only token; credentials not persisted)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hkmal797-bot/market-analysis-system
          ref: ${{ inputs.private_ref || 'feature/adaptive-capital-risk-pipeline-v1' }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install pinned Windows IANA time-zone database
        run: python -m pip install --disable-pip-version-check tzdata==2026.6

      - name: Run Windows Paper and adaptive safety tests
        working-directory: private-source
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        shell: pwsh
        run: |
          $patterns = @(
            "test_paper_trading_v1.py",
            "test_windows_paper_launcher.py",
            "test_windows_paper_readonly_launcher.py",
            "test_daily_backtest_v1.py",
            "test_sma_trend_signal_v1.py",
            "test_sma_walk_forward_v1.py",
            "test_strategy_intelligence_lab_v1.py",
            "test_strategy_language_v1.py",
            "test_shadow_learning_v1.py",
            "test_shadow_runner_v1.py",
            "test_shadow_daily_cycle_v1.py",
            "test_adaptive_strategy_supervisor_v1.py",
            "test_adaptive_daily_cycle_v1.py",
            "test_frozen_evaluation_v1.py",
            "test_cross_provider_session_evidence_v1.py",
            "test_cross_provider_ohlcv_parity_v1.py",
            "test_portfolio_risk_governor_v1.py",
            "test_capital_allocator_v1.py",
            "test_adaptive_capital_risk_pipeline_v1.py",
            "test_eodhd_local_archive_recovery_cli.py",
            "test_local_archive_media_v1.py",
            "test_eodhd_free_seven_root_local_capture.py"
          )
          foreach ($pattern in $patterns) {
            if (-not (Test-Path (Join-Path "tests" $pattern))) {
              Write-Output "SKIPPING_UNAVAILABLE_TEST_PATTERN=$pattern"
              continue
            }
            Write-Output "RUNNING_TEST_PATTERN=$pattern"
            python -m unittest discover -s tests -p $pattern -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Parse PowerShell Paper launchers without executing API actions
        working-directory: private-source
        shell: pwsh
        run: |
          $scripts = @(
            "scripts/run_paper_order_windows.ps1",
            "scripts/run_paper_account_readonly_windows.ps1"
          )
          foreach ($scriptPath in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $scriptPath),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
          }
          Write-Output "WINDOWS_PAPER_LAUNCHERS_SYNTAX=PASS"
          Write-Output "NO_ORDER_EXECUTED=TRUE"
