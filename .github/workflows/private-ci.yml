# PR48 correction: return the just-completed trial without requiring a sealed snapshot; SQLite concurrency fixture owns its connection per thread.
# PR48 regression fix: prioritize duplicate-ID rejection and anchor temporal leakage on the first realized evaluation return.
# PR48 Windows cleanup: explicitly close read-only SQLite observer and legacy-schema fixture connections.
