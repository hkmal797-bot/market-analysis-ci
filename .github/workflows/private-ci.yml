# Archive replay and live ingestion share one canonical content-identity digest.
# Final candidate selection is validated against a separate untouched holdout.
# Daily cycle tests enforce the configured seven-calendar-day latest-bar freshness bound.
# Adaptive cycle tests bind selected decisions to append-only, linked prequential outcomes.
# Shadow events use stable per-session fingerprints across extended historical replay.
# Prequential records bind canonical event payloads, not shifting sequence hashes.
# Frozen out-of-time tests require a future-only append and a durable single-use reservation.
# Registry integrity, retention gates and exclusion preflight are tested on both operating systems.
# Registry-first launch tests prove declaration commit precedes execution and bind training calendars.
# Re-run registry-first execution gates against the latest PR31 source head.
# Final source revision includes strict event-type and snapshot-shape validation.
# Legacy registry schema rejection is covered before any SQLite write.
# Frozen-registry tests explicitly close SQLite handles before Windows temp cleanup.
# Frozen exclusions reject boundary labels and a missing registry cannot silently reset.
# Provider-backed adaptive cycles require the durable registry and auto-load its exclusions.
# Cross-provider parity binds raw response hashes, adjustment bases and exact listing/session intersections.
# Split-event fixture IDs use the canonical archive observation identifier format.
# Canonical seven-root order and provider feed errors are asserted independently.
# Split-event candidates outside the exact seven listing IDs are rejected.
# The verifier binds aggregate statuses and records non-equivalent IEX versus consolidated feed scope.
# Historical SIP remains blocked by the tested account-specific 403; no SIP retry is performed.
# Insufficient holdout tests retain observed sample counts for auditability.
# EODHD split endpoint ratios are parsed as unclassified observations until action type and listing mapping are independently resolved.
# Split-adjustment consumers retain canonical record bytes and verify their SHA-256 before reconstruction.
# The parity verifier replays the canonical split-evidence payload and checks its content digest.
# Portfolio risk governance independently blocks concentration, turnover, drawdown and liquidity breaches.
# Risk governor fixtures now model sector aggregation and incremental ADV consumption correctly.
# Positive daily returns are non-loss observations; risk thresholds may explicitly be zero.
# Malformed risk assessment receipts are rejected without verifier exceptions.
# The canonical receipt verifier guard remains inside its fail-closed exception boundary.
# Adaptive orchestration joins verified strategy selection to complete portfolio risk approval.
# Capital allocation binds quality and dated ADV evidence to capped, residual-cash target weights.
# Adaptive capital-risk pipeline binds selection, allocation, risk, and final research decision receipts. Re-run after canonical memory-status field correction.
# Revalidation after duplicate-ID fixture correction and adaptive-memory status binding.
# Seven-root quality validation added; exact-source cross-platform CI.
# PR43 adds explicit root_scope and ordered symbols to five/seven-root quality receipts.
# PR44 verifies opt-in Linux Landlock enforcement in the actual spawned worker.
