on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read

env:
  PRIVATE_SOURCE_SHA: 'e4eae88d20c51907b9bb0ed42b2060b8e1a961e4'

concurrency:
  group: private-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit-tests:
    name: Standard-library unit tests (Ubuntu)
    if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'hkmal797-bot/market-analysis-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout private source (read-only token; credentials not persisted)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hkmal797-bot/market-analysis-system
          ref: ${{ env.PRIVATE_SOURCE_SHA }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1

      - name: Record exact private source commit
        working-directory: private-source
        env:
          EXPECTED_PRIVATE_SOURCE_SHA: ${{ env.PRIVATE_SOURCE_SHA }}
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_PRIVATE_SOURCE_SHA"
          echo "PRIVATE_SOURCE_SHA_VERIFIED=$actual"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Probe Linux OS sandbox primitives (diagnostic only)
        shell: bash
        run: |
          set +e
          echo "KERNEL=$(uname -sr)"
          echo "USER_NS_MAX=$(cat /proc/sys/user/max_user_namespaces 2>/dev/null || echo unavailable)"
          echo "BWRAP_PATH=$(command -v bwrap || echo unavailable)"
          echo "UNSHARE_PATH=$(command -v unshare || echo unavailable)"
          unshare --user --map-root-user --mount --net --fork sh -c 'echo LINUX_USER_MOUNT_NETWORK_NAMESPACES=AVAILABLE; id' 2>&1
          echo "LINUX_NAMESPACE_PROBE_EXIT=$?"
          if command -v bwrap >/dev/null 2>&1; then
            bwrap --unshare-user --unshare-pid --unshare-net --ro-bind /usr /usr --ro-bind /bin /bin --proc /proc --dev /dev /bin/true 2>&1
            echo "BWRAP_MINIMAL_PROBE_EXIT=$?"
          fi
          python - <<'PY'
          import ctypes, errno, os, subprocess, sys
          code = r"""
          import ctypes, errno, os
          libc = ctypes.CDLL(None, use_errno=True)
          class RulesetAttr(ctypes.Structure):
              _fields_ = [("handled_access_fs", ctypes.c_uint64)]
          # Landlock syscall numbers are 444/445/446 on supported Linux architectures.
          abi = libc.syscall(444, 0, 0, 1)
          print(f"LANDLOCK_ABI={abi}")
          if abi < 1:
              print(f"LANDLOCK_VERSION_PROBE_ERRNO={ctypes.get_errno()}")
              raise SystemExit(0)
          attr = RulesetAttr((1 << 2) | (1 << 3))  # READ_FILE | READ_DIR
          fd = libc.syscall(444, ctypes.byref(attr), ctypes.sizeof(attr), 0)
          if fd < 0:
              print(f"LANDLOCK_CREATE_ERRNO={ctypes.get_errno()}")
              raise SystemExit(0)
          if libc.prctl(38, 1, 0, 0, 0) != 0:
              print(f"LANDLOCK_NO_NEW_PRIVS_ERRNO={ctypes.get_errno()}")
              os.close(fd)
              raise SystemExit(0)
          if libc.syscall(446, fd, 0) != 0:
              print(f"LANDLOCK_RESTRICT_ERRNO={ctypes.get_errno()}")
              os.close(fd)
              raise SystemExit(0)
          os.close(fd)
          try:
              os.open("/etc/hostname", os.O_RDONLY)
          except OSError as exc:
              print(f"LANDLOCK_READ_DENIAL_ERRNO={exc.errno}")
              print(f"LANDLOCK_ENFORCEMENT_PROBE={'PASS' if exc.errno in (errno.EACCES, errno.EPERM) else 'FAIL'}")
          else:
              print("LANDLOCK_ENFORCEMENT_PROBE=FAIL")
          """
          p = subprocess.run([sys.executable, "-c", code], text=True, capture_output=True)
          print(p.stdout, end="")
          if p.stderr:
              print(p.stderr, end="", file=sys.stderr)
          print(f"LANDLOCK_PROBE_PROCESS_EXIT={p.returncode}")
          PY

      - name: Run complete deterministic unit-test suite
        working-directory: private-source
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v
      - name: Read-only Tigris raw-content probe (explicit validation PR only)
        if: (github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, '[RUN_TIGRIS_PROBE]')) || (github.event_name == 'push' && github.ref == 'refs/heads/main' && env.PRIVATE_SOURCE_SHA == 'b794281e0653d5ccf20adb3ba51575f20e853350')
        working-directory: private-source
        env:
          TIGRIS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_ACCESS_KEY_ID }}
          TIGRIS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_SECRET_ACCESS_KEY }}
          TIGRIS_ENDPOINT_URL: https://t3.storage.dev
          TIGRIS_REGION: auto
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          if [ -z "${TIGRIS_ACCESS_KEY_ID:-}" ] || [ -z "${TIGRIS_SECRET_ACCESS_KEY:-}" ]; then
            echo "TIGRIS_RAW_CONTENT_PROBE=SKIPPED_REQUIRED_SECRETS_UNAVAILABLE"
            exit 0
          fi
          python scripts/tigris_raw_content_probe.py

  windows-paper-safety:
    name: Windows Paper safety and adaptive-cycle tests
    if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'hkmal797-bot/market-analysis-ci')
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout private source (read-only token; credentials not persisted)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hkmal797-bot/market-analysis-system
          ref: ${{ env.PRIVATE_SOURCE_SHA }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1

      - name: Record exact private source commit
        working-directory: private-source
        env:
          EXPECTED_PRIVATE_SOURCE_SHA: ${{ env.PRIVATE_SOURCE_SHA }}
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_PRIVATE_SOURCE_SHA) { throw "PRIVATE_SOURCE_SHA_MISMATCH" }
          Write-Output "PRIVATE_SOURCE_SHA_VERIFIED=$actual"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Probe Windows AppContainer primitives (diagnostic only)
        shell: pwsh
        run: |
          $sig = 'using System;using System.Runtime.InteropServices;public static class AppContainerProbe{[DllImport("userenv.dll",CharSet=CharSet.Unicode)]public static extern int CreateAppContainerProfile(string name,string displayName,string description,IntPtr capabilities,uint capabilityCount,out IntPtr sid);[DllImport("userenv.dll",CharSet=CharSet.Unicode)]public static extern int DeleteAppContainerProfile(string name);[DllImport("kernel32.dll")]public static extern IntPtr LocalFree(IntPtr memory);}'
          Add-Type -TypeDefinition $sig
          $profile = "ChatGPTResearchProbe-" + [guid]::NewGuid().ToString("N")
          $sid = [IntPtr]::Zero
          $hr = [AppContainerProbe]::CreateAppContainerProfile($profile, $profile, "Temporary CI capability probe", [IntPtr]::Zero, 0, [ref]$sid)
          Write-Output "APPCONTAINER_CREATE_HRESULT=$hr"
          Write-Output "APPCONTAINER_PROFILE_CREATED=$($hr -eq 0 -or $hr -eq 0x800700B7)"
          if ($sid -ne [IntPtr]::Zero) { [AppContainerProbe]::LocalFree($sid) | Out-Null }
          $delete = [AppContainerProbe]::DeleteAppContainerProfile($profile)
          Write-Output "APPCONTAINER_CLEANUP_HRESULT=$delete"

      - name: Install pinned Windows IANA time-zone database
        run: python -m pip install --disable-pip-version-check tzdata==2026.6

      - name: Run Windows Paper and adaptive safety tests
        working-directory: private-source
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        shell: pwsh
        run: |
          $patterns = @(
            "test_paper_trading_v1.py",
            "test_windows_paper_launcher.py",
            "test_windows_paper_readonly_launcher.py",
            "test_daily_backtest_v1.py",
            "test_sma_trend_signal_v1.py",
            "test_sma_walk_forward_v1.py",
            "test_strategy_intelligence_lab_v1.py",
            "test_strategy_language_v1.py",
            "test_shadow_learning_v1.py",
            "test_shadow_runner_v1.py",
            "test_shadow_daily_cycle_v1.py",
            "test_adaptive_strategy_supervisor_v1.py",
            "test_adaptive_daily_cycle_v1.py",
            "test_frozen_evaluation_v1.py",
            "test_cross_provider_session_evidence_v1.py",
            "test_cross_provider_ohlcv_parity_v1.py",
            "test_portfolio_risk_governor_v1.py",
            "test_capital_allocator_v1.py",
            "test_adaptive_capital_risk_pipeline_v1.py",
            "test_adaptive_research_execution_v1.py",
            "test_system_research_to_paper_integration_v1.py",
            "test_adaptive_walk_forward_robustness_v1.py",
            "test_statistical_validity_anti_overfit_v1.py",
            "test_research_trial_registry_v1.py",
            "test_eodhd_local_archive_recovery_cli.py",
            "test_local_archive_media_v1.py",
            "test_eodhd_free_seven_root_local_capture.py",
            "test_tigris_raw_content_probe.py"
          )
          foreach ($pattern in $patterns) {
            if (-not (Test-Path (Join-Path "tests" $pattern))) {
              Write-Output "SKIPPING_UNAVAILABLE_TEST_PATTERN=$pattern"
              continue
            }
            Write-Output "RUNNING_TEST_PATTERN=$pattern"
            python -m unittest discover -s tests -p $pattern -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Parse PowerShell Paper launchers without executing API actions
        working-directory: private-source
        shell: pwsh
        run: |
          $scripts = @(
            "scripts/run_paper_order_windows.ps1",
            "scripts/run_paper_account_readonly_windows.ps1"
          )
          $parsedCount = 0
          foreach ($scriptPath in $scripts) {
            if (-not (Test-Path -LiteralPath $scriptPath -PathType Leaf)) {
              Write-Output "WINDOWS_PAPER_LAUNCHER_SKIPPED_MISSING=$scriptPath"
              continue
            }
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $scriptPath),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
            $parsedCount += 1
          }
          if ($parsedCount -eq 0) {
            Write-Output "WINDOWS_PAPER_LAUNCHERS_SYNTAX=SKIPPED_NO_LAUNCHERS_IN_SOURCE"
          } else {
            Write-Output "WINDOWS_PAPER_LAUNCHERS_SYNTAX=PASS"
          }
          Write-Output "NO_ORDER_EXECUTED=TRUE"

