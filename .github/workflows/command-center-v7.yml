name: Command Center V7 exact-source validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  ubuntu-full-suite:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[RUN_COMMAND_CENTER_V7]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hkmal797-bot/market-analysis-system
          ref: 4473ccdc07d1c5648234ffc28272f4fc6c7e0d6e
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source SHA
        working-directory: private-source
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "4473ccdc07d1c5648234ffc28272f4fc6c7e0d6e"
          echo "PRIVATE_SOURCE_SHA_VERIFIED=$actual"
      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Run complete deterministic test suite
        working-directory: private-source
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests

  windows-dashboard-contract:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[RUN_COMMAND_CENTER_V7]')
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hkmal797-bot/market-analysis-system
          ref: 4473ccdc07d1c5648234ffc28272f4fc6c7e0d6e
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source SHA
        working-directory: private-source
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          if ($actual -ne "4473ccdc07d1c5648234ffc28272f4fc6c7e0d6e") { throw "Private source SHA mismatch: $actual" }
          Write-Output "PRIVATE_SOURCE_SHA_VERIFIED=$actual"
      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Run dashboard contract tests
        working-directory: private-source
        shell: pwsh
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -p "test_research_command_center_ui_v1.py"
