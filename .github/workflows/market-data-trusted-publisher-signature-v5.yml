name: Market Data Trusted Publisher Signature V5 exact-source validation
run-name: Market Data Trusted Publisher Signature V5 exact-source validation

on:
  push:
    branches: [main, feature/market-data-trusted-publisher-signature-v5]
    paths:
      - ".github/workflows/market-data-trusted-publisher-signature-v5.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/market-data-trusted-publisher-signature-v5.yml"

permissions:
  contents: read

jobs:
  ubuntu-full-suite:
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/market-data-trusted-publisher-signature-v5')) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'hkmal797-bot/market-analysis-ci' && startsWith(github.event.pull_request.title, '[RUN_MARKET_DATA_TRUSTED_PUBLISHER_SIGNATURE_V5]'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact MarketAnalysis_AI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hkmal797-bot/market-analysis-system
          ref: ddfcf7498bc82f40f00c8ae1bfd109856ada8b10
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source commit
        working-directory: source
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "ddfcf7498bc82f40f00c8ae1bfd109856ada8b10"
          echo "PRIVATE_SOURCE_SHA_VERIFIED=$actual"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Install maintained Ed25519 verification dependency
        run: python -m pip install "cryptography>=44,<47"
      - name: Compile V5 implementation
        working-directory: source
        run: python -m py_compile tools/local_server.py tools/market_data_publisher_trust.py tools/market_data_evidence_artifacts.py tools/market_data_verification.py tools/launch_local.py
      - name: Run complete unit test suite
        working-directory: source
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests

  windows-contracts:
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/market-data-trusted-publisher-signature-v5')) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'hkmal797-bot/market-analysis-ci' && startsWith(github.event.pull_request.title, '[RUN_MARKET_DATA_TRUSTED_PUBLISHER_SIGNATURE_V5]'))
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact MarketAnalysis_AI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hkmal797-bot/market-analysis-system
          ref: ddfcf7498bc82f40f00c8ae1bfd109856ada8b10
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source commit
        working-directory: source
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          if ($actual -ne "ddfcf7498bc82f40f00c8ae1bfd109856ada8b10") { throw "Source SHA mismatch: $actual" }
          Write-Output "PRIVATE_SOURCE_SHA_VERIFIED=$actual"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Install maintained Ed25519 verification dependency
        run: python -m pip install "cryptography>=44,<47"
      - name: Compile V5 implementation
        working-directory: source
        run: python -m py_compile tools/local_server.py tools/market_data_publisher_trust.py tools/market_data_evidence_artifacts.py tools/market_data_verification.py tools/launch_local.py
      - name: Run V5 and prior evidence contracts
        working-directory: source
        shell: pwsh
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m unittest discover -s tests -p "test_market_data_publisher_trust_v5.py"
          python -m unittest discover -s tests -p "test_market_data_evidence_artifact_integrity_v4.py"
          python -m unittest discover -s tests -p "test_market_data_independent_verification_v3.py"
          python -m unittest discover -s tests -p "test_market_data_evidence_submission_v2.py"
          python -m unittest discover -s tests -p "test_market_data_admission_readiness_v1.py"
          python -m unittest discover -s tests -p "test_local_launcher_v1.py"
          python -m unittest discover -s tests -p "test_local_runtime_status_v2.py"
