name: Market Data Independent Verification V3 exact-source validation
run-name: Market Data Independent Verification V3 exact-source validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/market-data-independent-verification-v3.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/market-data-independent-verification-v3.yml"

permissions:
  contents: read

jobs:
  ubuntu-full-suite:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'hkmal797-bot/market-analysis-ci' && startsWith(github.event.pull_request.title, '[RUN_MARKET_DATA_INDEPENDENT_VERIFICATION_V3]'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact MarketAnalysis_AI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hkmal797-bot/market-analysis-system
          ref: 69969a0718769378b0c96e8bc2c21b0ada768999
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source commit
        working-directory: source
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "69969a0718769378b0c96e8bc2c21b0ada768999"
          echo "PRIVATE_SOURCE_SHA_VERIFIED=$actual"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Compile V3 admission and review implementation
        working-directory: source
        run: python -m py_compile tools/local_server.py tools/market_data_admission.py tools/market_data_verification.py tools/launch_local.py
      - name: Run complete unit test suite
        working-directory: source
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests

  windows-dashboard-contracts:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'hkmal797-bot/market-analysis-ci' && startsWith(github.event.pull_request.title, '[RUN_MARKET_DATA_INDEPENDENT_VERIFICATION_V3]'))
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact MarketAnalysis_AI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hkmal797-bot/market-analysis-system
          ref: 69969a0718769378b0c96e8bc2c21b0ada768999
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source commit
        working-directory: source
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          if ($actual -ne "69969a0718769378b0c96e8bc2c21b0ada768999") { throw "Source SHA mismatch: $actual" }
          Write-Output "PRIVATE_SOURCE_SHA_VERIFIED=$actual"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Compile V3 admission and review implementation
        working-directory: source
        run: python -m py_compile tools/local_server.py tools/market_data_admission.py tools/market_data_verification.py tools/launch_local.py
      - name: Run V3 and dashboard contracts
        working-directory: source
        shell: pwsh
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m unittest discover -s tests -p "test_market_data_independent_verification_v3.py"
          python -m unittest discover -s tests -p "test_market_data_evidence_submission_v2.py"
          python -m unittest discover -s tests -p "test_market_data_admission_readiness_v1.py"
          python -m unittest discover -s tests -p "test_local_launcher_v1.py"
          python -m unittest discover -s tests -p "test_local_runtime_status_v2.py"
