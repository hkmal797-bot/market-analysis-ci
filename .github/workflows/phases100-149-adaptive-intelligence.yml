name: Phases 100-149 adaptive intelligence exact-source validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phases100-149-adaptive-intelligence-exact-source
  cancel-in-progress: false

jobs:
  ubuntu-full-suite:
    name: Ubuntu — exact-source full suite
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout CI controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout exact private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hkmal797-bot/market-analysis-system
          ref: 9ad11115e260f06d85d2880f512581a9f9be869d
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source SHA
        working-directory: private-source
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "9ad11115e260f06d85d2880f512581a9f9be869d"
          echo "PRIVATE_SOURCE_SHA_VERIFIED=$actual"
      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Run complete deterministic suite
        working-directory: private-source
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v
      - name: Fingerprint adaptive source and safety boundaries
        working-directory: private-source
        shell: bash
        run: |
          sha256sum src/ma_engine/adaptive_intelligence.py src/ma_engine/research_continuity.py src/ma_engine/regime.py src/ma_engine/__init__.py tests/test_adaptive_intelligence_v1.py tests/test_stage06_import_boundary.py tests/test_stages_01_03.py docs/architecture/PHASE100_149_ADAPTIVE_STRATEGY_INTELLIGENCE_V1.md

  windows-safety-suite:
    name: Windows — adaptive, portfolio, paper and import safety
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout CI controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout exact private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hkmal797-bot/market-analysis-system
          ref: 9ad11115e260f06d85d2880f512581a9f9be869d
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source SHA
        working-directory: private-source
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne "9ad11115e260f06d85d2880f512581a9f9be869d") { throw "PRIVATE_SOURCE_SHA_MISMATCH" }
          Write-Output "PRIVATE_SOURCE_SHA_VERIFIED=$actual"
      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Run targeted deterministic and safety suites
        working-directory: private-source
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_adaptive_intelligence_v1.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_paper_supervisor_v1.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_portfolio_*v1.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_stage06_import_boundary.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_stages_01_03.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fingerprint adaptive source
        working-directory: private-source
        shell: pwsh
        run: |
          Get-FileHash src/ma_engine/adaptive_intelligence.py -Algorithm SHA256
          Get-FileHash tests/test_adaptive_intelligence_v1.py -Algorithm SHA256
