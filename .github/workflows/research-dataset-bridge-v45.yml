name: MarketAnalysis_AI V45 admitted research dataset bridge

on:
  push:
    branches: [main]
    paths: [".github/workflows/research-dataset-bridge-v45.yml"]
  pull_request:
    branches: [main]
    paths: [".github/workflows/research-dataset-bridge-v45.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketanalysis-v45-f4e3d22e9515d2cd4f8c9e74f6a9c45e6f137ca7
  cancel-in-progress: false

jobs:
  ubuntu-full-suite:
    name: V45 — Ubuntu full deterministic suite
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact MarketAnalysis_AI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hkmal797-bot/market-analysis-system
          ref: f4e3d22e9515d2cd4f8c9e74f6a9c45e6f137ca7
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify immutable source SHA
        working-directory: private-source
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "f4e3d22e9515d2cd4f8c9e74f6a9c45e6f137ca7"
          echo "PRIVATE_SOURCE_SHA_VERIFIED=$actual"
      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Install pinned runtime dependencies
        run: python -m pip install --disable-pip-version-check cryptography==50.0.2 tzdata==2026.6
      - name: Validate Mission Control HTML and run full suite
        working-directory: private-source
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          page = Path("apps/research-command-center/research-mission-control.html")
          source = page.read_text(encoding="utf-8")
          HTMLParser().feed(source)
          required = ("Admitted Dataset Bridge", "research-datasets/", "readonly", "Load an independently admitted dataset")
          for marker in required:
              if marker not in source:
                  raise SystemExit(f"Missing Mission Control contract: {marker}")
          print("V45_MISSION_CONTROL_HTML_OK")
          PY
          python -m unittest discover -s tests

  windows-safety-contracts:
    name: V45 — Windows research bridge safety contracts
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact MarketAnalysis_AI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hkmal797-bot/market-analysis-system
          ref: f4e3d22e9515d2cd4f8c9e74f6a9c45e6f137ca7
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify immutable source SHA
        working-directory: private-source
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne "f4e3d22e9515d2cd4f8c9e74f6a9c45e6f137ca7") { throw "Source SHA mismatch: $actual" }
          Write-Output "PRIVATE_SOURCE_SHA_VERIFIED=$actual"
      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Install pinned runtime dependencies
        run: python -m pip install --disable-pip-version-check cryptography==50.0.2 tzdata==2026.6
      - name: Run V45 bridge and mission contracts
        working-directory: private-source
        shell: pwsh
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m unittest discover -s tests -p "test_research_dataset_bridge_v45.py" -v
          python -m unittest discover -s tests -p "test_research_mission_control_v32.py" -v
          python -m unittest discover -s tests -p "test_research_preparation_v33.py" -v

# Exact immutable MarketAnalysis_AI source: f4e3d22e9515d2cd4f8c9e74f6a9c45e6f137ca7
