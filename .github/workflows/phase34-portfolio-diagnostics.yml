name: Phase 34 portfolio attribution diagnostics exact-source validation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/phase34-portfolio-diagnostics.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hkmal797-bot/market-analysis-system
          ref: 67daade7431ba6c2472204541ad9de5d97087567
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source
        working-directory: private-source
        run: test "$(git rev-parse HEAD)" = "67daade7431ba6c2472204541ad9de5d97087567"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Full suite
        working-directory: private-source
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v
      - name: SHA manifest
        working-directory: private-source
        run: sha256sum src/ma_engine/runtime.py src/ma_engine/portfolio_backtest.py src/ma_engine/portfolio_stress.py src/ma_engine/portfolio_walk_forward.py src/ma_engine/portfolio_path_stress.py src/ma_engine/portfolio_diagnostics.py src/ma_engine/__init__.py src/ma_engine/runtime.py tests/test_portfolio_diagnostics_v1.py tests/test_portfolio_backtest_v1.py tests/test_portfolio_stress_v1.py tests/test_portfolio_walk_forward_v1.py tests/test_portfolio_path_stress_v1.py tests/test_portfolio_diagnostics_v1.py tests/test_stage06_import_boundary.py tests/test_stages_01_03.py

  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hkmal797-bot/market-analysis-system
          ref: 67daade7431ba6c2472204541ad9de5d97087567
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source
        working-directory: private-source
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne "67daade7431ba6c2472204541ad9de5d97087567") { throw "SOURCE_SHA_MISMATCH" }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Windows groups
        working-directory: private-source
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        shell: pwsh
        run: |
          $patterns = @("test_stages_01_03.py","test_marketanalysis_core*.py","test_stages_04_05.py","test_stages_06.py","test_stages_07.py","test_stages_08.py","test_execution_lifecycle_v1.py","test_decision_assistant_v1.py","test_control_center_v1.py","test_runtime_v1.py","test_strategy_research_v1.py","test_strategy_catalog_v1.py","test_strategy_family_expansion_v1.py","test_market_regime_routing_v1.py","test_regime_aware_research_v1.py","test_regime_risk_v1.py","test_offline_research_cycle_v1.py","test_strategy_signal_generation_v1.py","test_candidate_screening_v1.py","test_candidate_arbitration_v1.py","test_research_candidate_link_v1.py","test_runtime_research_candidate_link_v1.py","test_coherent_offline_decision_cycle_v1.py","test_walk_forward_research_v1.py","test_runtime_walk_forward_v1.py","test_final_holdout_v1.py","test_runtime_final_holdout_v1.py","test_portfolio_backtest_v1.py","test_portfolio_stress_v1.py","test_portfolio_walk_forward_v1.py","test_portfolio_path_stress_v1.py","test_portfolio_diagnostics_v1.py","test_stage06_import_boundary.py")
          foreach ($pattern in $patterns) {
            $found=Get-ChildItem tests -Filter $pattern -File
            if ($found.Count -eq 0) { throw "MISSING_GROUP=$pattern" }
            python -m unittest discover -s tests -p $pattern -v
            if ($LASTEXITCODE -ne 0) { throw "FAILED_GROUP=$pattern" }
          }
      - name: SHA manifest
        working-directory: private-source
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path src/ma_engine -Filter *.py -File | Select-Object -ExpandProperty FullName) + @("tests/test_runtime_final_holdout_v1.py","tests/test_stage06_import_boundary.py")
          Get-FileHash -Algorithm SHA256 -LiteralPath $files
