name: Security Recovery Intelligence V27 exact-source validation
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ubuntu-full-suite:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == 'hkmal797-bot/market-analysis-ci' && startsWith(github.event.pull_request.title, '[RUN_SECURITY_RECOVERY_V27]'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hkmal797-bot/market-analysis-system
          ref: b6701b0184600b2607158a175638d31157de3e1f
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source SHA
        working-directory: private-source
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "b6701b0184600b2607158a175638d31157de3e1f"
          echo "PRIVATE_SOURCE_SHA_VERIFIED=$actual"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Install existing V25 crypto dependency
        run: python -m pip install "cryptography>=44,<48"
      - name: Compile and run complete deterministic suite
        working-directory: private-source
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m py_compile tools/security_recovery_intelligence_v27.py tools/local_server.py tools/launch_local.py
          python -m unittest discover -s tests

  windows-contracts:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == 'hkmal797-bot/market-analysis-ci' && startsWith(github.event.pull_request.title, '[RUN_SECURITY_RECOVERY_V27]'))
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hkmal797-bot/market-analysis-system
          ref: b6701b0184600b2607158a175638d31157de3e1f
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source SHA
        working-directory: private-source
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          if ($actual -ne "b6701b0184600b2607158a175638d31157de3e1f") { throw "Source SHA mismatch: $actual" }
          Write-Output "PRIVATE_SOURCE_SHA_VERIFIED=$actual"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Install existing V25 crypto dependency
        run: python -m pip install "cryptography>=44,<48"
      - name: Run Windows security and dashboard contracts
        working-directory: private-source
        shell: pwsh
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m unittest discover -s tests -p "test_security_recovery_intelligence_v27.py"
          python -m unittest discover -s tests -p "test_security_recovery_intelligence_v27_contracts.py"
          python -m unittest discover -s tests -p "test_system_center_v20.py"
          python -m unittest discover -s tests -p "test_local_data_protection_v26.py"
          python -m unittest discover -s tests -p "test_local_data_protection_v26_contracts.py"
          python -m unittest discover -s tests -p "test_encrypted_backup_v25_contracts.py"
          python -m unittest discover -s tests -p "test_persistent_audit_v1.py"
          python -m unittest discover -s tests -p "test_research_run_archive_v1.py"
