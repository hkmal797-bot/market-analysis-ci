name: V104 local research session monitor validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: v104-local-session-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  ubuntu-full-suite:
    name: Ubuntu — full deterministic suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout validation harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Checkout exact private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hkmal797-bot/market-analysis-system
          ref: 57bb6365a06463955501d785e478642d92c006da
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify immutable source SHA
        working-directory: private-source
        env:
          EXPECTED_SOURCE_SHA: 57bb6365a06463955501d785e478642d92c006da
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SOURCE_SHA"
          echo "PRIVATE_SOURCE_SHA_VERIFIED=$actual"
      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Install test runtime dependency
        run: python -m pip install --disable-pip-version-check cryptography
      - name: Compile dashboard and V104 test
        working-directory: private-source
        run: python -m py_compile tests/test_local_research_session_monitor_v104.py
      - name: Run complete deterministic suite
        working-directory: private-source
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests

  windows-dashboard-contract:
    name: Windows — V104 dashboard contracts
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout validation harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Checkout exact private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hkmal797-bot/market-analysis-system
          ref: 57bb6365a06463955501d785e478642d92c006da
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify immutable source SHA
        working-directory: private-source
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          if ($actual -ne "57bb6365a06463955501d785e478642d92c006da") { throw "Source SHA mismatch: $actual" }
          Write-Output "PRIVATE_SOURCE_SHA_VERIFIED=$actual"
      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Run V104 dashboard contracts
        working-directory: private-source
        shell: pwsh
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m unittest discover -s tests -p "test_local_research_session_monitor_v104.py"
          python -m unittest discover -s tests -p "test_research_command_center_ui_v1.py"
