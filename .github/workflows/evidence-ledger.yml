name: Evidence ledger integrity

on:
  push:
    branches:
      - "evidence/**"
    paths:
      - "evidence-ledger/**"
      - "scripts/verify_evidence_ledger.py"
      - "tests/test_verify_evidence_ledger.py"
      - ".github/workflows/evidence-ledger.yml"
  pull_request:
    branches:
      - main
    paths:
      - "evidence-ledger/**"
      - "scripts/verify_evidence_ledger.py"
      - "tests/test_verify_evidence_ledger.py"
      - ".github/workflows/evidence-ledger.yml"

permissions:
  contents: read

concurrency:
  group: evidence-ledger-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify-ledger:
    name: Verify receipt archive and adversarial ledger tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Verify complete evidence ledger
        run: python scripts/verify_evidence_ledger.py

      - name: Run adversarial integrity tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -p "test_verify_evidence_ledger.py" -v
