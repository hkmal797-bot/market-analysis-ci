name: Local runtime integration V2 exact-source validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  ubuntu-full-suite:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[RUN_LOCAL_LAUNCHER_V1]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hkmal797-bot/market-analysis-system
          ref: 6a860b37e46c939067d57761eab42a7f6a5a3a3b
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify immutable source SHA
        working-directory: private-source
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "6a860b37e46c939067d57761eab42a7f6a5a3a3b"
          echo "LOCAL_RUNTIME_V2_SOURCE_SHA_VERIFIED=$actual"
      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Compile launcher and run full suite
        working-directory: private-source
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m py_compile tools/launch_local.py tools/local_server.py
          python -m unittest discover -s tests

  windows-launcher-contract:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[RUN_LOCAL_LAUNCHER_V1]')
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hkmal797-bot/market-analysis-system
          ref: 6a860b37e46c939067d57761eab42a7f6a5a3a3b
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify immutable source SHA
        working-directory: private-source
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          if ($actual -ne "6a860b37e46c939067d57761eab42a7f6a5a3a3b") { throw "Private source SHA mismatch: $actual" }
          Write-Output "LOCAL_RUNTIME_V2_SOURCE_SHA_VERIFIED=$actual"
      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Run Windows launcher contract tests
        working-directory: private-source
        shell: pwsh
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m py_compile tools/launch_local.py tools/local_server.py
          python -m unittest discover -s tests -p "test_local_launcher_v1.py"
          python -m unittest discover -s tests -p "test_local_runtime_status_v2.py"
