name: Provider Sample Validation V37 exact-source validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu-full-suite:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == 'hkmal797-bot/market-analysis-ci' && startsWith(github.event.pull_request.title, '[RUN_PROVIDER_SAMPLE_V37]'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hkmal797-bot/market-analysis-system
          ref: 04f2256f99fbaf298e3f05272d50550a4bdda196
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source SHA
        working-directory: private-source
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "04f2256f99fbaf298e3f05272d50550a4bdda196"
          echo "PRIVATE_SOURCE_SHA_VERIFIED=$actual"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Install existing crypto dependency
        run: python -m pip install "cryptography>=44,<48"
      - name: Compile and run complete deterministic suite
        working-directory: private-source
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m py_compile tools/provider_sample_validation_v37.py tools/provider_research_shortlist_v36.py tools/provider_evaluation_center_v35.py tools/local_server.py
          python -m unittest discover -s tests

  windows-contracts:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == 'hkmal797-bot/market-analysis-ci' && startsWith(github.event.pull_request.title, '[RUN_PROVIDER_SAMPLE_V37]'))
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hkmal797-bot/market-analysis-system
          ref: 04f2256f99fbaf298e3f05272d50550a4bdda196
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source SHA
        working-directory: private-source
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          if ($actual -ne "04f2256f99fbaf298e3f05272d50550a4bdda196") { throw "Source SHA mismatch: $actual" }
          Write-Output "PRIVATE_SOURCE_SHA_VERIFIED=$actual"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Install existing crypto dependency
        run: python -m pip install "cryptography>=44,<48"
      - name: Run provider sample validation and dashboard contracts
        working-directory: private-source
        shell: pwsh
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m py_compile tools/provider_sample_validation_v37.py tools/provider_research_shortlist_v36.py tools/provider_evaluation_center_v35.py tools/local_server.py
          python -m unittest discover -s tests -p "test_provider_sample_validation_v37.py"
          python -m unittest discover -s tests -p "test_provider_research_shortlist_v36.py"
          python -m unittest discover -s tests -p "test_provider_evaluation_center_v35.py"
          python -m unittest discover -s tests -p "test_system_center_v20.py"
