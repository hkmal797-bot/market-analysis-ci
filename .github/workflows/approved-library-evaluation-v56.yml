name: MarketAnalysis_AI V56 Full Approved-Library Evaluation exact-source validation

on:
  push:
    branches: [main, feature/approved-library-evaluation-v56-ci]
    paths: [".github/workflows/approved-library-evaluation-v56.yml"]
  pull_request:
    branches: [main]
    paths: [".github/workflows/approved-library-evaluation-v56.yml"]

permissions:
  contents: read

concurrency:
  group: marketanalysis-v56-fa53b6c44a939285127802dbc8c7c411450a25c1
  cancel-in-progress: false

jobs:
  ubuntu-full-suite:
    name: V56 — Ubuntu full deterministic suite
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/approved-library-evaluation-v56-ci')) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'hkmal797-bot/market-analysis-ci' && startsWith(github.event.pull_request.title, '[RUN_V56]'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact MarketAnalysis_AI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hkmal797-bot/market-analysis-system
          ref: fa53b6c44a939285127802dbc8c7c411450a25c1
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify immutable source SHA
        working-directory: private-source
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "fa53b6c44a939285127802dbc8c7c411450a25c1"
          echo "PRIVATE_SOURCE_SHA_VERIFIED=$actual"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Install pinned runtime dependencies
        run: python -m pip install --disable-pip-version-check cryptography==50.0.2 tzdata==2026.6
      - name: Compile V56 implementation and server
        working-directory: private-source
        run: python -m py_compile tools/approved_library_evaluation_v56.py tools/approved_strategy_library_v55.py tools/strategy_evaluation.py tools/research_dataset_bridge_v45.py tools/local_server.py
      - name: Validate Strategy Library HTML and JavaScript
        working-directory: private-source
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          raw = Path("apps/research-command-center/strategy-library.html").read_text(encoding="utf-8")
          class Checker(HTMLParser):
              def error(self, message):
                  raise RuntimeError(message)
          Checker().feed(raw)
          scripts = re.findall(r"<script[^>]*>(.*?)</script>", raw, re.S | re.I)
          if len(scripts) != 1:
              raise SystemExit("Expected one inline script in Strategy Library page")
          Path("/tmp/strategy-library-v56.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/strategy-library-v56.js
      - name: Run full deterministic suite
        working-directory: private-source
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests

  windows-v56-contracts:
    name: V56 — Windows full-library, provenance, HTTP and launcher contracts
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/approved-library-evaluation-v56-ci')) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'hkmal797-bot/market-analysis-ci' && startsWith(github.event.pull_request.title, '[RUN_V56]'))
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact MarketAnalysis_AI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hkmal797-bot/market-analysis-system
          ref: fa53b6c44a939285127802dbc8c7c411450a25c1
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify immutable source SHA
        working-directory: private-source
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne "fa53b6c44a939285127802dbc8c7c411450a25c1") { throw "Source SHA mismatch: $actual" }
          Write-Output "PRIVATE_SOURCE_SHA_VERIFIED=$actual"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Install pinned runtime dependencies
        run: python -m pip install --disable-pip-version-check cryptography==50.0.2 tzdata==2026.6
      - name: Compile V56 implementation and server
        working-directory: private-source
        run: python -m py_compile tools/approved_library_evaluation_v56.py tools/approved_strategy_library_v55.py tools/strategy_evaluation.py tools/research_dataset_bridge_v45.py tools/local_server.py
      - name: Run V56 full-library regression and Windows safety contracts
        working-directory: private-source
        shell: pwsh
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m unittest discover -s tests -p "test_approved_library_evaluation_v56.py" -v
          python -m unittest discover -s tests -p "test_approved_library_evaluation_http_v56.py" -v
          python -m unittest discover -s tests -p "test_approved_strategy_library_v55.py" -v
          python -m unittest discover -s tests -p "test_strategy_evaluation_v6.py" -v
          python -m unittest discover -s tests -p "test_local_launcher_v1.py" -v

# Exact immutable MarketAnalysis_AI source: fa53b6c44a939285127802dbc8c7c411450a25c1
