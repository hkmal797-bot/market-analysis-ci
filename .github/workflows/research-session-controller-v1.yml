name: Research Session Controller V1 exact-source validation

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/research-session-controller-v1.yml"

permissions:
  contents: read

jobs:
  ubuntu-full-suite:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'hkmal797-bot/market-analysis-ci' && startsWith(github.event.pull_request.title, '[RUN_RESEARCH_SESSION_CONTROLLER_V1]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact MarketAnalysis_AI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hkmal797-bot/market-analysis-system
          ref: fce35bfaefb590c1a1f6dd1d0cfafc5b3249de7c
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source commit
        working-directory: source
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "fce35bfaefb590c1a1f6dd1d0cfafc5b3249de7c"
          echo "PRIVATE_SOURCE_SHA_VERIFIED=$actual"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Compile local runtime integration
        working-directory: source
        run: python -m py_compile tools/local_persistence.py tools/research_archive.py tools/research_sessions.py tools/launch_local.py tools/local_server.py
      - name: Run complete unit test suite
        working-directory: source
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests

  windows-local-contracts:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'hkmal797-bot/market-analysis-ci' && startsWith(github.event.pull_request.title, '[RUN_RESEARCH_SESSION_CONTROLLER_V1]')
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact MarketAnalysis_AI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hkmal797-bot/market-analysis-system
          ref: fce35bfaefb590c1a1f6dd1d0cfafc5b3249de7c
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source commit
        working-directory: source
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          if ($actual -ne "fce35bfaefb590c1a1f6dd1d0cfafc5b3249de7c") { throw "Source SHA mismatch: $actual" }
          Write-Output "PRIVATE_SOURCE_SHA_VERIFIED=$actual"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Compile Windows local integration
        working-directory: source
        run: python -m py_compile tools/research_sessions.py tools/launch_local.py tools/local_server.py
      - name: Run Windows local contracts
        working-directory: source
        shell: pwsh
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m unittest discover -s tests -p "test_research_session_controller_v1.py"
          python -m unittest discover -s tests -p "test_research_session_http_v1.py"
          python -m unittest discover -s tests -p "test_local_runtime_status_v2.py"
          python -m unittest discover -s tests -p "test_research_run_archive_v1.py"
          python -m unittest discover -s tests -p "test_offline_research_cycle_v1.py"
          python -m unittest discover -s tests -p "test_portfolio_research_campaign_v1.py"
          python -m unittest discover -s tests -p "test_local_launcher_v1.py"
