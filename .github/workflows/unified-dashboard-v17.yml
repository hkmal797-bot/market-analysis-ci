name: Unified Command Center V17 exact-source validation
run-name: Unified Command Center V17 exact-source validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/unified-dashboard-v17.yml"
  pull_request:
    branches: [main]
    paths: [".github/workflows/unified-dashboard-v17.yml"]

permissions:
  contents: read

jobs:
  ubuntu-full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact MarketAnalysis_AI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hkmal797-bot/market-analysis-system
          ref: 29fdbc3a50f590a0d56d40271af12b2fd631d4cc
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source commit
        working-directory: source
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "29fdbc3a50f590a0d56d40271af12b2fd631d4cc"
          echo "PRIVATE_SOURCE_SHA_VERIFIED=$actual"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Install existing test dependency
        run: python -m pip install "cryptography>=44,<47"
      - name: Compile local server
        working-directory: source
        run: python -m py_compile tools/local_server.py
      - name: Validate dashboard HTML and JavaScript
        working-directory: source
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          class Checker(HTMLParser):
              pass
          for name in ("index.html", "research-intelligence.html", "strategy-library.html"):
              source = (Path("apps/research-command-center") / name).read_text(encoding="utf-8")
              Checker().feed(source)
              scripts = re.findall(r"<script[^>]*>(.*?)</script>", source, re.S | re.I)
              Path("/tmp/" + name + ".js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/index.html.js
          node --check /tmp/strategy-library.html.js
          node --check /tmp/research-intelligence.html.js
      - name: Run complete deterministic test suite
        working-directory: source
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v

  windows-v17-contracts:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact MarketAnalysis_AI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hkmal797-bot/market-analysis-system
          ref: 29fdbc3a50f590a0d56d40271af12b2fd631d4cc
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source commit
        working-directory: source
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne "29fdbc3a50f590a0d56d40271af12b2fd631d4cc") { throw "Source SHA mismatch: $actual" }
          Write-Output "PRIVATE_SOURCE_SHA_VERIFIED=$actual"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Compile local server
        working-directory: source
        run: python -m py_compile tools/local_server.py
      - name: Run V17 dashboard contracts
        working-directory: source
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -p "test_unified_command_center_shell_v17.py" -v

# Exact source pin: 29fdbc3a50f590a0d56d40271af12b2fd631d4cc
