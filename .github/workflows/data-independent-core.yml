name: Private source data-independent core tests

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/data-independent-core.yml"

permissions:
  contents: read

concurrency:
  group: data-independent-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-unit-tests:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'hkmal797-bot/market-analysis-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout public CI workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout exact private source revision (read-only token)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hkmal797-bot/market-analysis-system
          ref: f65c7acfcb63947fda851276d2351b18f34380ca
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact private source commit
        working-directory: private-source
        env:
          EXPECTED_PRIVATE_SOURCE_SHA: f65c7acfcb63947fda851276d2351b18f34380ca
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_PRIVATE_SOURCE_SHA"
          echo "PRIVATE_SOURCE_SHA_VERIFIED=$actual"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Run focused offline core tests
        working-directory: private-source
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -p 'test_marketanalysis_core*.py' -v
