name: Strategy Library Candidate Generation V7 exact-source validation
run-name: Strategy Library Candidate Generation V7 exact-source validation

on:
  push:
    branches: [main, feature/strategy-library-candidate-generation-v7]
    paths:
      - ".github/workflows/strategy-library-candidate-generation-v7.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/strategy-library-candidate-generation-v7.yml"

permissions:
  contents: read

jobs:
  ubuntu-full-suite:
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/strategy-library-candidate-generation-v7')) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'hkmal797-bot/market-analysis-ci' && startsWith(github.event.pull_request.title, '[RUN_STRATEGY_LIBRARY_V7]'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact MarketAnalysis_AI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hkmal797-bot/market-analysis-system
          ref: 6c67de16d60bb8cda83c00231ce16b33ca056058
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source commit
        working-directory: source
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "6c67de16d60bb8cda83c00231ce16b33ca056058"
          echo "PRIVATE_SOURCE_SHA_VERIFIED=$actual"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Install existing V5 Ed25519 test dependency
        run: python -m pip install "cryptography>=44,<47"
      - name: Compile V7 implementation
        working-directory: source
        run: python -m py_compile tools/strategy_library.py tools/local_server.py tools/strategy_evaluation.py
      - name: Validate dashboard markup and inline JavaScript
        working-directory: source
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          class Checker(HTMLParser):
              def error(self, message):
                  raise RuntimeError(message)
          for name in ("index.html", "strategy-library.html"):
              path = Path("apps/research-command-center") / name
              source = path.read_text(encoding="utf-8")
              Checker().feed(source)
              scripts = [m.group(1) for m in re.finditer(r"<script[^>]*>(.*?)</script>", source, re.S | re.I)]
              if scripts:
                  target = Path("/tmp") / (name + ".js")
                  target.write_text("\n".join(scripts), encoding="utf-8")
                  import subprocess
                  subprocess.run(["node", "--check", str(target)], check=True)
          PY
      - name: Run complete unit and integration suite
        working-directory: source
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests

  windows-contracts:
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/strategy-library-candidate-generation-v7')) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'hkmal797-bot/market-analysis-ci' && startsWith(github.event.pull_request.title, '[RUN_STRATEGY_LIBRARY_V7]'))
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact MarketAnalysis_AI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hkmal797-bot/market-analysis-system
          ref: 6c67de16d60bb8cda83c00231ce16b33ca056058
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source commit
        working-directory: source
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          if ($actual -ne "6c67de16d60bb8cda83c00231ce16b33ca056058") { throw "Source SHA mismatch: $actual" }
          Write-Output "PRIVATE_SOURCE_SHA_VERIFIED=$actual"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Compile V7 implementation
        working-directory: source
        run: python -m py_compile tools/strategy_library.py tools/local_server.py
      - name: Run V7 strategy library contracts
        working-directory: source
        shell: pwsh
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -p "test_strategy_library_v7.py"
