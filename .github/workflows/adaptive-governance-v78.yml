name: MarketAnalysis_AI V78 adaptive shortlist governance boundary
on:
  push:
    branches: [main]
    paths: [".github/workflows/adaptive-governance-v78.yml"]
  pull_request:
    branches: [main]
    paths: [".github/workflows/adaptive-governance-v78.yml"]
permissions:
  contents: read
concurrency:
  group: marketanalysis-v78-f7f67122159061e1e8c434bbd9dc15170dcde935
  cancel-in-progress: false
jobs:
  ubuntu-full-suite:
    name: V78 exact source — Ubuntu full deterministic suite
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'hkmal797-bot/market-analysis-ci' && startsWith(github.event.pull_request.title, '[RUN_V78]'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact MarketAnalysis_AI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hkmal797-bot/market-analysis-system
          ref: f7f67122159061e1e8c434bbd9dc15170dcde935
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify immutable source SHA
        working-directory: private-source
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "f7f67122159061e1e8c434bbd9dc15170dcde935"
          echo "PRIVATE_SOURCE_SHA_VERIFIED=$actual"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Install pinned runtime dependencies
        run: python -m pip install --disable-pip-version-check cryptography==50.0.2 tzdata==2026.6
      - name: Compile V50 governance boundary
        working-directory: private-source
        run: python -m py_compile tools/adaptive_strategy_selection_v50.py tests/test_adaptive_strategy_selection_v50.py
      - name: Run full deterministic suite
        working-directory: private-source
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests
  windows-adaptive-selection-contracts:
    name: V78 exact source — Windows adaptive shortlist governance contracts
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'hkmal797-bot/market-analysis-ci' && startsWith(github.event.pull_request.title, '[RUN_V78]'))
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact MarketAnalysis_AI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hkmal797-bot/market-analysis-system
          ref: f7f67122159061e1e8c434bbd9dc15170dcde935
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify immutable source SHA
        working-directory: private-source
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne "f7f67122159061e1e8c434bbd9dc15170dcde935") { throw "Source SHA mismatch: $actual" }
          Write-Output "PRIVATE_SOURCE_SHA_VERIFIED=$actual"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Install pinned runtime dependencies
        run: python -m pip install --disable-pip-version-check cryptography==50.0.2 tzdata==2026.6
      - name: Compile V50 governance boundary
        working-directory: private-source
        run: python -m py_compile tools/adaptive_strategy_selection_v50.py tests/test_adaptive_strategy_selection_v50.py
      - name: Run adaptive shortlist governance contracts
        working-directory: private-source
        shell: pwsh
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m unittest discover -s tests -p "test_adaptive_strategy_selection_v50.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_adaptive_strategy_selection_http_v50.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
