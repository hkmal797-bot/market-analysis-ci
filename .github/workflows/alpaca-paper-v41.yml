name: Alpaca Paper V41 exact-source validation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/alpaca-paper-v41.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpaca-paper-v41-${{ github.sha }}
  cancel-in-progress: false

jobs:
  ubuntu-full-suite:
    name: Alpaca Paper V41 — Ubuntu full deterministic suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact MarketAnalysis_AI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hkmal797-bot/market-analysis-system
          ref: 094ac1cb4ffb98390b087ba5fce7365cc608e72e
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source SHA
        working-directory: private-source
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "094ac1cb4ffb98390b087ba5fce7365cc608e72e"
          echo "PRIVATE_SOURCE_SHA_VERIFIED=$actual"
      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Install pinned test runtime dependencies
        run: python -m pip install --disable-pip-version-check cryptography==50.0.2 tzdata==2026.6
      - name: Compile touched modules and run complete deterministic suite
        working-directory: private-source
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m py_compile tools/alpaca_paper_readonly.py tools/local_server.py
          python -m unittest discover -s tests

  windows-contracts:
    name: Alpaca Paper V41 — Windows safety contracts
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact MarketAnalysis_AI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hkmal797-bot/market-analysis-system
          ref: 094ac1cb4ffb98390b087ba5fce7365cc608e72e
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source SHA
        working-directory: private-source
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          if ($actual -ne "094ac1cb4ffb98390b087ba5fce7365cc608e72e") { throw "Source SHA mismatch: $actual" }
          Write-Output "PRIVATE_SOURCE_SHA_VERIFIED=$actual"
      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Install pinned test runtime dependencies
        run: python -m pip install --disable-pip-version-check cryptography==50.0.2 tzdata==2026.6
      - name: Run Paper connector, dashboard, and System Center contracts
        working-directory: private-source
        shell: pwsh
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m unittest discover -s tests -p "test_alpaca_paper_readonly_v41.py"
          python -m unittest discover -s tests -p "test_alpaca_paper_dashboard_v41.py"
          python -m unittest discover -s tests -p "test_system_center_v20.py"
